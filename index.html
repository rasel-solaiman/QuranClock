<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Clock Widget - Android App</title>
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; color: #3c4043; }
        .header { background: white; padding: 24px; display: flex; align-items: center; border-bottom: 1px solid #dadce0; }
        .logo { width: 80px; height: 80px; border-radius: 16px; margin-right: 20px; }
        .btn { display: block; width: 100%; max-width: 250px; margin: 20px 0; padding: 14px; background: #01875f; color: white; text-align: center; text-decoration: none; border-radius: 4px; font-weight: bold; }
        
        /* Screenshot Modal */
        .screenshots { display: flex; gap: 12px; overflow-x: auto; padding: 20px 0; }
        .screenshots img { height: 320px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        
        #modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        #modal img { display: block; margin: auto; max-height: 90%; margin-top: 5%; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <img src="qc_logo.png" class="logo">
        <h1>Quran Clock Widget</h1>
    </div>

    <div class="main-container" style="max-width: 800px; margin: auto; padding: 20px;">
        <!-- ডাউনলোড বাটন ফিক্স -->
        <a href="https://github.com/rasel-solaiman/QuranClock/releases/download/Quran/Quran.clock.apk" class="btn" download>Install</a>

        <div class="screenshots">
            <img src="L_P.jpg" onclick="openModal(this.src)">
            <img src="L_A.jpg" onclick="openModal(this.src)">
            <!-- অন্য সব ছবি এখানে এভাবে থাকবে -->
        </div>
    </div>

    <!-- মোডাল স্ট্রাকচার -->
    <div id="modal" onclick="this.style.display='none'">
        <img id="modalImg">
    </div>

    <script>
        function openModal(src) {
            document.getElementById('modal').style.display = 'block';
            document.getElementById('modalImg').src = src;
        }
    </script>
</body>
</html>
